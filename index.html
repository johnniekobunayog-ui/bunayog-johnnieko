.banner-track {
    position: absolute;
    top: 0;
    left: 50%;
    height: 100%;
    display: flex;
    align-items: center;
    transform: translateX(-50%);
}

.banner-text {
    color: white;
    font-size: 15.2px;

    height: 100%;

    white-space: nowrap;

    text-transform: uppercase;
    letter-spacing: 2px;
}
      

.background-slide {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

.background-slide img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
}

.sname{

.product-grid {

.product-card {

.product-card img {

.product-card:hover {
